[toolchain]
anchor_version = "0.30.1"
solana_version = "4.2.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
stackapp = "GGqhbbXPZg2GGZP1o7CUeNkqATybrDJbX7cxJiwEzaFL"

[programs.localnet]
stackapp = "GGqhbbXPZg2GGZP1o7CUeNkqATybrDJbX7cxJiwEzaFL"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "NODE_OPTIONS=--no-experimental-strip-types yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 15000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
slots_per_epoch = "32"
