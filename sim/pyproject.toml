[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stackapp-sim"
version = "0.1.0"
description = "Python mirror of the StackApp Anchor program's math and state transitions"
requires-python = ">=3.10"
license = { text = "MIT" }
# Deliberately zero dependencies: the whole point is that the accumulator and
# the anti-gaming rules can be exercised anywhere Python runs.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["stackapp_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
